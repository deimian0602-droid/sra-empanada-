<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandejas de empanadas</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #FBF3E1 0%, #F3E4C4 45%, #E9D3A3 100%);
    margin: 0;
    padding: 24px 16px;
    color: #2C2C2A;
    min-height: 100vh;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 28px 20px 24px;
    box-shadow: 0 4px 18px rgba(74,44,29,0.12);
    border-top: 4px solid #4A2C1D;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .header p { font-size: 13px; color: #6b6b68; margin: 4px 0 0; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #EEECE5;
  }
  .row:last-of-type { border-bottom: none; }
  .flavor { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .flavor-emoji { font-size: 22px; }
  .qty-controls { display: flex; align-items: center; gap: 12px; }
  .qty-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid #D3D1C7;
    background: #FAFAF8;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:active { background: #EEECE5; }
  .qty-val { min-width: 20px; text-align: center; font-size: 16px; font-weight: 500; }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 20px 0;
    padding-top: 16px;
    border-top: 1px solid #EEECE5;
  }
  .total-label { font-size: 14px; color: #6b6b68; }
  .total-val { font-size: 26px; font-weight: 600; }
  .send-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #25D366;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .send-btn:active { opacity: 0.85; }
  .error-msg {
    display: none;
    font-size: 13px;
    color: #D85A30;
    margin: 10px 0 0;
    text-align: center;
  }
  .name-field { margin-bottom: 18px; }
  .name-field label {
    display: block;
    font-size: 13px;
    color: #6b6b68;
    margin-bottom: 6px;
  }
  .name-field input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #D3D1C7;
    border-radius: 8px;
    background: #FAFAF8;
    color: #2C2C2A;
  }
  .name-field input:focus {
    outline: none;
    border-color: #25D366;
  }
</style>
</head>

    <p>4 unidades por bandeja · $2.50 c/u</p>
  </div>

  <div class="name-field">
    <label for="buyer-name">Tu nombre</label>
    <input type="text" id="buyer-name" placeholder="Ej: María Pérez">
  </div>

  <div id="items"></div>

  <div class="total-row">
    <span class="total-label">Total</span>
    <span class="total-val" id="total">$0.00</span>
  </div>

  <button class="send-btn" id="send-btn">
    Enviar pedido por WhatsApp
  </button>
  <p class="error-msg" id="error">Elige al menos una bandeja antes de enviar.</p>
</div>

<script>
  const flavors = [
    { id: 'queso', name: 'Queso', emoji: '🧀' },
    { id: 'pollo', name: 'Pollo', emoji: '🍗' },
    { id: 'carne', name: 'Carne', emoji: '🥩' }
  ];
  const price = 2.50;
  const phone = '593998101170';

  const itemsEl = document.getElementById('items');
  const state = {};

  flavors.forEach(f => {
    state[f.id] = 0;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="flavor">
        <span class="flavor-emoji">${f.emoji}</span>
        <span>${f.name}</span>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" data-action="dec" data-id="${f.id}">-</button>
        <span class="qty-val" id="qty-${f.id}">0</span>
        <button class="qty-btn" data-action="inc" data-id="${f.id}">+</button>
      </div>
    `;
    itemsEl.appendChild(row);
  });

  function updateTotal() {
    let total = 0;
    flavors.forEach(f => { total += state[f.id] * price; });
    document.getElementById('total').textContent = '$' + total.toFixed(2);
  }

  itemsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === 'inc') state[id]++;
    if (action === 'dec') state[id] = Math.max(0, state[id] - 1);
    document.getElementById('qty-' + id).textContent = state[id];
    updateTotal();
    document.getElementById('error').style.display = 'none';
  });

  document.getElementById('send-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('buyer-name');
    const name = nameInput.value.trim();
    const chosen = flavors.filter(f => state[f.id] > 0);
    const errorEl = document.getElementById('error');

    if (!name) {
      errorEl.textContent = 'Escribe tu nombre antes de enviar.';
      errorEl.style.display = 'block';
      nameInput.focus();
      return;
    }
    if (chosen.length === 0) {
      errorEl.textContent = 'Elige al menos una bandeja antes de enviar.';
      errorEl.style.display = 'block';
      return;
    }
    let total = 0;
    let lines = chosen.map(f => {
      const subtotal = state[f.id] * price;
      total += subtotal;
      return `${state[f.id]} bandeja(s) de ${f.name} - $${subtotal.toFixed(2)}`;
    });
    const message = `Hola! Soy ${name} y quiero pedir:\n${lines.join('\n')}\n\nTotal: $${total.toFixed(2)}`;
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.location.href = url;
  });
</script>
